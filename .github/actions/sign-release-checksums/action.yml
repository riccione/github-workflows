---
---
name: Sign Release Checksums
description: Downloads release assets, generates SHA-256 checksums, signs and verifies the manifest, and uploads it to GitHub Releases

inputs:
  tag:
    description: GitHub release tag
    required: true

  repository:
    description: GitHub repository in owner/name format
    required: true

  token:
    description: GitHub token for release asset operations
    required: true

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Download release assets
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_TAG: ${{ inputs.tag }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        mkdir -p release-assets
        gh release download "$RELEASE_TAG" \
          --repo "$REPOSITORY" \
          --dir release-assets

    - name: Generate SHA256SUMS
      shell: bash
      working-directory: release-assets
      run: |
        find . -maxdepth 1 -type f \
          ! -name 'SHA256SUMS*' \
          -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

    - name: Sign SHA256SUMS
      shell: bash
      working-directory: release-assets
      run: |
        cosign sign-blob \
          --yes \
          --bundle SHA256SUMS.sigstore.json \
          SHA256SUMS

    - name: Verify signature
      shell: bash
      working-directory: release-assets
      run: |
        cosign verify-blob SHA256SUMS \
          --bundle SHA256SUMS.sigstore.json \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          --certificate-identity-regexp '^https://github\.com/riccione/github-workflows/\.github/workflows/rust-release\.yml@.*$'

    - name: Upload checksums and signature
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_TAG: ${{ inputs.tag }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        gh release upload "$RELEASE_TAG" \
          --repo "$REPOSITORY" \
          release-assets/SHA256SUMS \
          release-assets/SHA256SUMS.sigstore.json \
          --clobber

    - name: Verify final release assets
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_TAG: ${{ inputs.tag }}
        REPOSITORY: ${{ inputs.repository }}
      run: |
        gh release view "$RELEASE_TAG" \
          --repo "$REPOSITORY" \
          --json tagName,isPrerelease,isDraft,assets \
          --jq '.assets[] | .name'
