---
name: Release

on:
  workflow_call:
    inputs:
      apt_packages:
        description: Additional apt packages to install on Ubuntu
        type: string
        default: ""

      bin_names:
        description: "Space-separated list of compiled binaries (e.g. 'nomforge-cli nomforge-gui')"
        required: true
        type: string

      use_upx:
        type: boolean
        default: false

      cargo_args:
        type: string
        default: "--locked"

      tag:
        required: true
        type: string

      build_musl:
        description: Build Linux MUSL target
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Create the release before matrix builds start
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Set Changelog Base Reference
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_RELEASE=$(gh release view --json tagName --template '{{.tagName}}' 2>/dev/null || echo "")
          if [ -n "$LATEST_RELEASE" ]; then
            echo "CHANGELOG_BASE=$LATEST_RELEASE" >> $GITHUB_ENV
          else
            echo "CHANGELOG_BASE=$(git rev-list --max-parents=0 HEAD)" >> $GITHUB_ENV
          fi

      - name: Generate Changelog
        id: changelog
        uses: jaywcjlove/changelog-generator@1009fc1683464607a9b4329d95742507f3207055  # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ env.CHANGELOG_BASE }}

      - name: Ensure GitHub Release Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            PRERELEASE_FLAG=""
            if [[ "${{ github.ref }}" != refs/tags/* ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi

            gh release create "${{ inputs.tag }}" \
              --title "${{ inputs.tag }}" \
              --notes "${{ steps.changelog.outputs.changelog }}" \
              $PRERELEASE_FLAG
          fi

  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate build matrix
        id: set-matrix
        env:
          BUILD_MUSL: ${{ inputs.build_musl }}
        run: |
          matrix='[
            {
              "build": "linux-x86_64",
              "os": "ubuntu-latest",
              "target": "x86_64-unknown-linux-gnu",
              "platform": "linux-x86_64",
              "ext": ""
            },
            {
              "build": "windows-x86_64",
              "os": "windows-latest",
              "target": "x86_64-pc-windows-msvc",
              "platform": "win-x86_64",
              "ext": ".exe"
            },
            {
              "build": "macos-x86_64",
              "os": "macos-15-intel",
              "target": "x86_64-apple-darwin",
              "platform": "macos-x86_64",
              "ext": ""
            },
            {
              "build": "macos-arm64",
              "os": "macos-latest",
              "target": "aarch64-apple-darwin",
              "platform": "macos-arm64",
              "ext": ""
            }
          ]'

          if [[ "$BUILD_MUSL" == "true" ]]; then
            matrix=$(jq '. + [{
              "build": "linux-musl-x86_64",
              "os": "ubuntu-latest",
              "target": "x86_64-unknown-linux-musl",
              "platform": "linux-musl-x86_64",
              "ext": ""
            }]' <<< "$matrix")
          fi

          matrix=$(jq -c '.' <<< "$matrix")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Build across matrix platforms and upload assets
  build-release:
    needs:
      - create-release
      - prepare-matrix

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target is installed
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Verify Rust target
        run: |
          rustc --version
          rustup target list --installed
          rustc --print target-libdir --target ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update

          # Install musl-tools only if the target contains 'musl'
          if [[ "${{ matrix.target }}" == *"musl"* ]]; then
            sudo apt-get install -y musl-tools
          fi

          # Install any custom packages passed in via inputs
          if [[ -n "${{ inputs.apt_packages }}" ]]; then
            sudo apt-get install -y ${{ inputs.apt_packages }}
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ inputs.cargo_args }}

      - name: Strip Symbols
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          for bin in ${{ inputs.bin_names }}; do
            strip target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}
          done

      - name: Verify musl binary is static
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          for bin in ${{ inputs.bin_names }}; do
            FILE_INFO=$(file target/${{ matrix.target }}/release/${bin})
            echo "Info for $bin: $FILE_INFO"

            # Check if 'dynamically linked' is present in the output
            if echo "$FILE_INFO" | grep -q "dynamically linked"; then
              echo "ERROR: $bin is dynamically linked! musl build failed."
              exit 1
            else
              echo "SUCCESS: $bin is statically linked."
            fi
          done

      - name: Run UPX
        if: matrix.os == 'ubuntu-latest' && inputs.use_upx
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          for bin in ${{ inputs.bin_names }}; do
            upx --best --lzma "target/${{ matrix.target }}/release/${bin}" || true
          done

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets

          for bin in ${{ inputs.bin_names }}; do
            source="target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}"
            destination="release-assets/${bin}_${{ matrix.platform }}${{ matrix.ext }}"

            if [[ ! -f "$source" ]]; then
              echo "ERROR: Binary not found: $source"
              exit 1
            fi

            cp "$source" "$destination"
          done

      - name: Upload binaries to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for bin in ${{ inputs.bin_names }}; do
            asset="release-assets/${bin}_${{ matrix.platform }}${{ matrix.ext }}"

            echo "Uploading ${asset}"

            gh release upload "${{ inputs.tag }}" \
              "${asset}" \
              --repo "${{ github.repository }}" \
              --clobber
          done

      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --json tagName,isPrerelease,isDraft,assets \
            --jq '.assets[] | .name'

  # Generate checksums and sign the manifest
  checksums:
    name: Generate and Sign SHA-256 Checksums
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-assets
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS*' \
            -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Sign SHA256SUMS
        working-directory: release-assets
        run: |
          cosign sign-blob \
            --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS

      - name: Verify signature
        working-directory: release-assets
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${REPOSITORY}/"

      - name: Upload checksums and signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            release-assets/SHA256SUMS \
            release-assets/SHA256SUMS.sigstore.json \
            --clobber

      - name: Verify final release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --json tagName,isPrerelease,isDraft,assets \
            --jq '.assets[] | .name'
