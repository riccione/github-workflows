---
name: Release

on:
  workflow_call:
    inputs:
      apt_packages:
        description: Additional apt packages to install on Ubuntu
        type: string
        default: ""

      bin_names:
        description: "Space-separated list of compiled binaries (e.g. 'nomforge-cli nomforge-gui')"
        required: true
        type: string

      use_upx:
        type: boolean
        default: true

      cargo_args:
        type: string
        default: "--locked"

      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Create the release draft/tag upfront before matrix builds start
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Set Changelog Base Reference
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_RELEASE=$(gh release view --json tagName --template '{{.tagName}}' 2>/dev/null || echo "")
          if [ -n "$LATEST_RELEASE" ]; then
            echo "CHANGELOG_BASE=$LATEST_RELEASE" >> $GITHUB_ENV
          else
            echo "CHANGELOG_BASE=$(git rev-list --max-parents=0 HEAD)" >> $GITHUB_ENV
          fi

      - name: Generate Changelog
        id: changelog
        uses: jaywcjlove/changelog-generator@1009fc1683464607a9b4329d95742507f3207055  # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ env.CHANGELOG_BASE }}

      - name: Ensure GitHub Release Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            PRERELEASE_FLAG=""
            if [[ "${{ github.ref }}" != refs/tags/* ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi

            gh release create "${{ inputs.tag }}" \
              --title "${{ inputs.tag }}" \
              --notes "${{ steps.changelog.outputs.changelog }}" \
              $PRERELEASE_FLAG
          fi

  # Build across matrix platforms and upload assets
  build-release:
    name: ${{ matrix.build }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            ext: ""
          - build: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win-x86_64
            ext: ".exe"
          - build: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            ext: ""
          - build: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify Rust target
        run: |
          rustc --version
          rustup target list --installed
          rustc --print target-libdir --target ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest' && inputs.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt_packages }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ inputs.cargo_args }}

      - name: Strip Symbols
        if: matrix.os != 'windows-latest'
        run: |
          for bin in ${{ inputs.bin_names }}; do
            strip target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}
          done

      - name: Prepare UPX File List
        if: matrix.os == 'ubuntu-latest' && inputs.use_upx
        id: upx_files
        run: |
          FILE_LIST=""
          for bin in ${{ inputs.bin_names }}; do
            FILE_LIST="${FILE_LIST}target/${{ matrix.target }}/release/${bin} "
          done
          echo "files=${FILE_LIST}" >> $GITHUB_OUTPUT

      - name: Run UPX
        if: matrix.os == 'ubuntu-latest' && inputs.use_upx
        uses: crazy-max/ghaction-upx@c83f378efc804f828e988debb88ed6116feb2368  # v4
        with:
          version: latest
          files: ${{ steps.upx_files.outputs.files }}
          args: --best --lzma

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for bin in ${{ inputs.bin_names }}; do
            gh release upload "${{ inputs.tag }}" \
              "target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}#${bin}_${{ matrix.platform }}${{ matrix.ext }}" \
              --clobber
          done

  # Generate checksums after all assets are uploaded
  checksums:
    name: Generate SHA-256 checksums
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-assets
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            release-assets/SHA256SUMS \
            --clobber
